<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>{{TITLE}}</h1>

    <fieldset>
      <legend>Theme</legend>
      <div class="radiogroup">
        <label><input type="radio" name="themeMode" value="auto" /> Auto</label>
        <label><input type="radio" name="themeMode" value="light" /> Light</label>
        <label><input type="radio" name="themeMode" value="dark" /> Dark</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>On the page</legend>
      <label><input type="checkbox" id="behaviour.showButtons" /> Show injected buttons</label>
      <p class="hint">The extension only touches pages that match its site gate.</p>
    </fieldset>

    <p class="error" id="save-error" role="alert" hidden></p>

    <!-- Loaded first: content/settings.js owns the DEFAULTS, so the popup cannot drift. -->
    <script src="../content/settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
